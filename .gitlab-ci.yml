stages: [build, deploy, cleanup]

variables:
  DEPLOY_DIR: /srv/freestore

default:
  tags: [webs]

.on_push:
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_PIPELINE_SOURCE == "push"

build:
  stage: build
  extends: .on_push
  script:
    - touch .env
    - sudo docker compose build --pull

deploy:
  stage: deploy
  extends: .on_push
  environment: production
  script:
    - test -f "$DEPLOY_DIR/.env" || { echo "Create $DEPLOY_DIR/.env from .env.example"; exit 1; }
    - sudo rsync -a --delete --exclude .git --exclude .env ./ "$DEPLOY_DIR/"
    - cd "$DEPLOY_DIR" && sudo docker compose up -d --no-build --remove-orphans --wait

cleanup:
  stage: cleanup
  extends: .on_push
  allow_failure: true
  script:
    - sudo docker image prune -f
