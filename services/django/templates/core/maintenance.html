{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <title>Maintenance — Freestore</title>
  <link rel="icon" href="{% static 'favicon.ico' %}">
  <link rel="stylesheet" href="{% static 'css/store.css' %}">
  <style>
    .maintenance-root {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 24px;
      /* Blue + deep navy glows (no purple accent) */
      background:
        radial-gradient(ellipse 78% 58% at 50% 20%, rgba(59, 130, 246, 0.38), transparent 54%),
        radial-gradient(ellipse 52% 42% at 88% 86%, rgba(30, 64, 175, 0.35), transparent 50%),
        radial-gradient(ellipse 48% 38% at 8% 72%, rgba(15, 23, 42, 0.75), transparent 48%),
        var(--bg-main);
    }

    .maintenance-modal {
      width: min(440px, 100%);
      text-align: center;
      padding: 36px 32px;
      background: linear-gradient(165deg, rgba(30, 58, 138, 0.22), var(--bg-card));
      box-shadow:
        0 24px 80px rgba(0, 0, 0, 0.5),
        0 0 0 1px rgba(59, 130, 246, 0.12),
        0 0 60px rgba(37, 99, 235, 0.08);
    }

    .maintenance-badge {
      width: 56px;
      height: 56px;
      margin: 0 auto 22px;
      border-radius: 16px;
      display: grid;
      place-items: center;
      background: var(--brand-dim);
      border: 1px solid rgba(59, 130, 246, 0.45);
      font-size: 26px;
      line-height: 1;
    }

    .maintenance-title {
      font-size: 1.35rem;
      font-weight: 800;
      letter-spacing: -0.03em;
      margin: 0 0 14px;
      color: #93c5fd;
    }

    .maintenance-text {
      margin: 0;
      font-size: 15px;
      line-height: 1.6;
      color: var(--text-muted);
      font-weight: 500;
    }
  </style>
</head>

<body class="maintenance-root">
  <div class="modal maintenance-modal" role="dialog" aria-labelledby="maint-title" aria-live="polite">
    <div class="maintenance-badge" aria-hidden="true">⚙</div>
    <h1 class="maintenance-title" id="maint-title">Temporarily unavailable :(</h1>
    <p class="maintenance-text">
      We're currently performing maintenance.
      <br>Sorry for the inconvenience — please check back soon!
    </p>
  </div>
</body>

</html>
