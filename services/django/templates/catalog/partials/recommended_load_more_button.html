{% if next_page %}
  <div class="spacer-24"></div>
  <button
    type="button"
    class="action-btn"
    style="width:100%;max-width:340px;display:block;margin:0 auto;"
    hx-get="{% url 'catalog:home' %}?feed={{ active_feed }}{% if search_query %}&q={{ search_query|urlencode }}{% endif %}{% if filter_tag %}&tag={{ filter_tag|urlencode }}{% endif %}&page={{ next_page }}&chunk=recommended"
    hx-target="#recommended-grid"
    hx-swap="beforeend"
  >
    Show more
  </button>
{% endif %}
