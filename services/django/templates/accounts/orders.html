{% extends "base.html" %}

{% block title %}My orders - FreeStorex{% endblock %}

{% block content %}
<style>
  .account-page{padding-top:18px}
  @media (max-width:899px){.account-page{padding-top:14px}}
  .account-page .profile-layout{display:grid;grid-template-columns:260px 1fr;grid-template-areas:"nav main";gap:26px;align-items:start}
  .account-page .profile-nav{grid-area:nav;background:var(--bg-card);border:1px solid rgba(255,255,255,.06);border-radius:20px;padding:10px;display:grid;gap:8px}
  .account-page .profile-layout > .section{grid-area:main}
  .account-page .profile-btn{width:100%;min-height:180px;display:flex;align-items:center;justify-content:flex-start;font-size:34px;font-weight:900;letter-spacing:-.02em}
  .account-page .profile-btn.active{border-color:rgba(255,255,255,.2);background:rgba(255,255,255,.08)}
  .account-page .profile-hero{border-radius:30px;padding:24px;border:1px solid rgba(255,255,255,.08);background:linear-gradient(180deg,rgba(255,255,255,.03),rgba(255,255,255,.01))}
  .account-page .orders-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
  .account-page .order-card{border:1px solid rgba(255,255,255,.08);background:var(--bg-card);border-radius:20px;padding:14px;display:grid;grid-template-columns:80px 1fr;gap:14px;align-items:center}
  .account-page .order-thumb{width:80px;height:80px;border-radius:12px;background:var(--bg-main);border:1px solid rgba(255,255,255,.1);display:grid;place-items:center;color:var(--text-muted);font-weight:900}
  .account-page .status-badge{border-radius:999px;padding:4px 10px;font-size:11px;font-weight:800}
  .account-page .status-pending{color:#fca5a5;background:rgba(239,68,68,.12);border:1px solid rgba(239,68,68,.22)}
  .account-page .status-paid{color:#93c5fd;background:rgba(59,130,246,.12);border:1px solid rgba(59,130,246,.22)}
  .account-page .history-list{display:grid;gap:10px}
  .account-page .history-card{
    display:block;
    color:inherit;
    border:1px solid rgba(255,255,255,.08);
    border-radius:16px;
    padding:14px;
    background:rgba(255,255,255,.02);
    transition:background .18s ease,border-color .18s ease,transform .18s ease;
  }
  .account-page .history-card:hover{
    background:rgba(255,255,255,.04);
    border-color:rgba(255,255,255,.14);
    transform:translateY(-1px);
  }
  .account-page .history-desktop{display:block}
  .account-page .history-mobile{display:none}
  .account-page .history-head{
    display:flex;
    justify-content:space-between;
    gap:10px;
    flex-wrap:wrap;
    align-items:flex-start;
  }
  .account-page .history-aside{
    text-align:right;
    display:grid;
    justify-items:end;
    gap:6px;
  }
  .account-page .history-title{
    margin:0 0 6px;
    font-weight:800;
    font-size:16px;
    letter-spacing:0;
    line-height:1.25;
  }
  .account-page .history-meta{
    margin:0;
    color:var(--text-muted);
    font-size:12px;
    line-height:1.35;
    word-break:break-word;
  }
  .account-page .history-status-row{
    margin-top:8px;
    display:flex;
    align-items:center;
    gap:8px;
  }
  .account-page .history-divider{height:1px;background:rgba(255,255,255,.09);margin:10px 0}
  .account-page .history-total{
    font-size:16px;
    font-weight:900;
    line-height:1.2;
    white-space:normal;
    word-break:break-word;
  }
  .account-page .history-pagination{
    margin-top:12px;
    display:flex;
    align-items:center;
    gap:8px;
    flex-wrap:wrap;
  }
  @media (max-width: 899px) {
    .account-page .profile-layout {
      grid-template-columns: 1fr;
      grid-template-areas:
        "main"
        "nav";
      gap: 16px;
    }
    .account-page .profile-nav {
      grid-area: nav;
      display: flex;
      flex-direction: row;
      align-items: stretch;
      gap: 6px;
      padding: 8px 10px;
      margin: 0;
      border-radius: 16px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      background: rgba(12, 13, 15, 0.92);
      -webkit-backdrop-filter: blur(12px);
      backdrop-filter: blur(12px);
      box-shadow: 0 8px 28px rgba(0, 0, 0, 0.35);
    }
    .account-page .profile-btn {
      flex: 1;
      min-width: 0;
      min-height: 44px;
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 0;
      padding: 8px 6px;
      justify-content: center;
      text-align: center;
      line-height: 1.2;
    }
    .account-page .history-card{
      padding:12px;
      border-radius:14px;
    }
    .account-page .history-desktop{display:none}
    .account-page .history-mobile{display:block}
    .account-page .history-title{
      font-size:18px;
      line-height:1.2;
      margin:0 0 6px;
    }
    .account-page .history-meta{
      font-size:12px;
      line-height:1.45;
    }
    .account-page .history-total{
      font-size:20px;
      line-height:1.1;
      white-space:normal;
      word-break:break-word;
    }
    .account-page .history-pagination{
      justify-content:space-between;
    }
  }
  @media (max-width:899px){.account-page .orders-grid{grid-template-columns:1fr}}
</style>
<section class="account-page" hx-boost="false">
{% include "accounts/partials/account_orders_page_content.html" %}
</section>
{% endblock %}
